services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schoolportal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/schoolportal
      - PORT=5000
    depends_on:
      - db

volumes:
  postgres_data:

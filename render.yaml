services:
  - type: web
    name: uniportal
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uniportal-db
          property: connectionString

databases:
  - name: uniportal-db
    databaseName: uniportal
    user: uniportal_user
    plan: free

services:
  - type: web
    name: uniportal
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: uniportal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: uniportal-db
    databaseName: uniportal
    user: uniportal_user
    plan: free
